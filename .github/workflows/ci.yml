name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only by default (Constitution I, research R13). Jobs never get write access.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (discovery)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: discovery
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: discovery/uv.lock
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check
      - name: Format check
        run: uv run ruff format --check
      - name: Type check
        run: uv run mypy
      - name: Tests
        run: uv run pytest
      - name: Validate data
        run: uv run netc validate-data --data-dir ../data
      - name: Dependency audit
        run: |
          uv export --locked --no-emit-project --format requirements.txt -o "$RUNNER_TEMP/requirements.txt"
          uv run pip-audit --strict --disable-pip -r "$RUNNER_TEMP/requirements.txt"

  web:
    name: Web (lint, audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npx eslint .
      - name: Bundle three.js (T153)
        run: npm run build:vendor
      - name: Header map budget (150 KB gzipped, T154)
        run: npm run check:budget
      - name: Dependency audit
        run: npm audit --audit-level=high

  site:
    name: Site (browser tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: discovery/uv.lock
      - name: Install discovery
        working-directory: discovery
        run: uv sync --locked
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      # Builds the site from data/ and serves it with web/_headers (the real CSP), then runs
      # the home page and header map checks and axe-core (T154).
      - name: Browser tests
        run: npx playwright test

  workers:
    name: Workers (typecheck, test, audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: workers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: workers/package-lock.json
      - name: Install
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Tests
        run: npx vitest run
      - name: Dependency audit
        run: npm audit --audit-level=high

  bot-data-only:
    # Always runs so it can be a required check; the path rule applies only to the bot's PRs
    # (constitution v1.1.0: bot PRs may auto-merge only when they change nothing but data/).
    name: Bot PRs change only data/
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'netechconnect-bot[bot]'
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check changed paths
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'netechconnect-bot[bot]'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          # Three dots: what the PR changed since it branched, not what main changed since.
          changed="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"
          if [ "$HEAD_REF" = "review/open" ]; then
            other="$(printf '%s\n' "$changed" | grep -vx 'data/review/open.json' | grep . || true)"
            if [ -n "$other" ]; then
              echo "::error::The review PR may change only data/review/open.json. It also changes:"
              echo "$other"
              exit 1
            fi
            echo "The review PR changes only data/review/open.json."
            exit 0
          fi
          outside="$(printf '%s\n' "$changed" | grep -v '^data/' | grep . || true)"
          if [ -n "$outside" ]; then
            echo "::error::A bot PR may change only data/. These files are outside it:"
            echo "$outside"
            exit 1
          fi
          if printf '%s\n' "$changed" | grep -qx 'data/review/open.json'; then
            echo "::error::Only the review PR may change data/review/open.json."
            exit 1
          fi
          echo "All changed files are under data/."
      - name: Not a bot PR
        if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'netechconnect-bot[bot]'
        run: echo "Not a data PR from netechconnect-bot; nothing to check."

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The token is read-only, so the action cannot comment on PRs; findings are in the
          # job summary and the failed check instead.
          GITLEAKS_ENABLE_COMMENTS: "false"
