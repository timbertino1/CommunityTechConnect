name: Review PR

# Open, update or close the review PR (contracts/workflows-and-review.md, "Review PR") whenever
# the review queue on main changes: after a discovery data PR or an apply-review PR merges.
# Built from main as it is, so the PR lists only items already in main's queue. It used to run
# alongside discovery, before that run's data PR merged, so new items waited for the next run.
# Never auto-merged: only the owner merges a review PR.
on:
  push:
    branches: [main]
    paths: [data/review/queue.json]
  workflow_dispatch:

# The default token is read-only; the review PR is written with the GitHub App's own token.
permissions:
  contents: read

concurrency:
  group: review-pr
  cancel-in-progress: false

jobs:
  review:
    name: Open or update the review PR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: discovery
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: discovery/uv.lock
      - name: Install
        working-directory: discovery
        run: uv sync --locked
      - name: Create the bot's token
        id: bot
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Open, update or close the review PR
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          BOT_SLUG: ${{ steps.bot.outputs.app-slug }}
        run: bash .github/scripts/review-pr.sh

