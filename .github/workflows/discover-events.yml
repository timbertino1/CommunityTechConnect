name: Discover events

# Twice daily, so a delayed or skipped run still reads every source within 24 hours (FR-002).
on:
  schedule:
    - cron: "0 11 * * *"
    - cron: "0 23 * * *"
  workflow_dispatch:

# The default token is read-only; the data PR is written with the GitHub App's own token.
permissions:
  contents: read

concurrency:
  group: discover
  cancel-in-progress: false

jobs:
  discover:
    name: Discover events and open the data PR
    runs-on: ubuntu-latest
    # actions: read only lets the health step see whether the scheduled workflows are still
    # switched on (T145; GitHub turns schedules off after 60 days without activity).
    permissions:
      contents: read
      actions: read
    timeout-minutes: 60
    environment: discovery
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: discovery/uv.lock
      - name: Install
        working-directory: discovery
        run: uv sync --locked
      - name: Keep main's run status
        run: cp data/state/source_status.json "$RUNNER_TEMP/previous-status.json" || true
      - name: Discover events
        working-directory: discovery
        env:
          NETC_SITE_DOMAIN: ${{ vars.SITE_DOMAIN || 'netechconnect.pages.dev' }}
          # The AI second opinion for listings the rules can't decide (R10); off without it.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Eventbrite organizer sources (T103-T104); they fail and are recorded without it.
          EVENTBRITE_TOKEN: ${{ secrets.EVENTBRITE_TOKEN }}
        run: uv run netc discover-events --data-dir ../data --report "$RUNNER_TEMP/run-report.md"
      - name: Show the run report
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/run-report.md" ]; then
            cat "$RUNNER_TEMP/run-report.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Validate data
        working-directory: discovery
        run: uv run netc validate-data --data-dir ../data
      - name: Create the bot's token
        id: bot
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Open or update the data PR
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          BOT_SLUG: ${{ steps.bot.outputs.app-slug }}
          REPORT_FILE: ${{ runner.temp }}/run-report.md
        run: bash .github/scripts/data-pr.sh
      # After the data PR, so a problem here never holds up the data. Its own token, so the
      # data PR's token can't touch issues.
      - name: Create the bot's issue token
        id: issues
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-issues: write
      - name: Update the Discovery health issue
        if: steps.issues.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.issues.outputs.token }}
          BOT_SLUG: ${{ steps.issues.outputs.app-slug }}
          OWNER: ${{ github.repository_owner }}
          PREVIOUS_STATUS: ${{ runner.temp }}/previous-status.json
          WORKFLOW_TOKEN: ${{ github.token }}
        run: bash .github/scripts/health-issue.sh
