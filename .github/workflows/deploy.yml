name: Deploy site

# Every change to main (including merged data PRs) rebuilds the site. The daily schedule also
# rebuilds after each discovery run, so events that have ended leave the list even on days
# with no data changes.
on:
  push:
    branches: [main]
  schedule:
    - cron: "30 11 * * *"
    - cron: "30 23 * * *"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: discovery/uv.lock
      - name: Install
        working-directory: discovery
        run: uv sync --locked
      - name: Validate data
        working-directory: discovery
        run: uv run netc validate-data --data-dir ../data
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            workers/package-lock.json
      # The home header map's three.js, tree-shaken to what it uses (T153); build-site copies it.
      - name: Bundle three.js
        working-directory: web
        run: |
          npm ci
          npm run build:vendor
      - name: Build site
        working-directory: discovery
        env:
          NETC_SITE_DOMAIN: ${{ vars.SITE_DOMAIN || 'netechconnect.pages.dev' }}
        run: uv run netc build-site --data ../data --out ../dist --web ../web
      - name: Install wrangler
        working-directory: workers
        run: npm ci
      - name: Create the Pages project if it does not exist yet
        working-directory: workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          if npx wrangler pages project list | grep -qw netechconnect; then
            echo "Pages project netechconnect exists."
          else
            npx wrangler pages project create netechconnect --production-branch main
          fi
      - name: Deploy
        working-directory: workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: npx wrangler pages deploy ../dist --project-name netechconnect --branch main
