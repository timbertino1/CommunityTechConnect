version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/discovery"
    schedule:
      interval: "weekly"
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]
    # Only propose releases at least 14 days old (supply-chain hygiene, same rule as uv and
    # npm installs). Dependabot security updates are not delayed by this.
    cooldown:
      default-days: 14

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    groups:
      web-minor-patch:
        update-types: ["minor", "patch"]
    # Only propose releases at least 14 days old (supply-chain hygiene, same rule as uv and
    # npm installs). Dependabot security updates are not delayed by this.
    cooldown:
      default-days: 14

  - package-ecosystem: "npm"
    directory: "/workers"
    schedule:
      interval: "weekly"
    groups:
      workers-minor-patch:
        update-types: ["minor", "patch"]
    # Only propose releases at least 14 days old (supply-chain hygiene, same rule as uv and
    # npm installs). Dependabot security updates are not delayed by this.
    cooldown:
      default-days: 14
    ignore:
      # @cloudflare/vitest-pool-workers supports only vitest 4.x (peer ^4.1). Remove this
      # once it supports vitest 5.
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
    # Only propose releases at least 14 days old (supply-chain hygiene, same rule as uv and
    # npm installs). Dependabot security updates are not delayed by this.
    cooldown:
      default-days: 14
