# Location areas used for filtering (FR-036) and the gazetteer used to place events in them.
# Matching order when normalizing an event: venue, then city, then ZIP, then ZIP prefix; the
# omaha and lincoln entries are checked before other_ne. Places listed under out_of_state are
# outside Nebraska: their events are kept only when a Nebraska-based group hosts them (FR-003).
# Seed list, 2026-10-17: extend by pull request when a real event is misplaced.
areas:
  - id: omaha
    label: Omaha area
    cities:
      - Omaha
      - Bellevue
      - Papillion
      - La Vista
      - Ralston
