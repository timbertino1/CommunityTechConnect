[project]
name = "netc"
version = "0.1.0"
description = "NETechConnect discovery pipeline and static site generator"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "icalendar>=6",
    "recurring-ical-events>=3",
    "feedparser>=6",
    "selectolax>=0.3",
    "nh3>=0.2",
    "pydantic>=2",
    "jinja2>=3.1",
    "protego>=0.4",
    "rapidfuzz>=3",
    "openai>=1",
    "pyyaml>=6",
    "jsonschema>=4",
    "tzdata>=2025.1",
]

[project.scripts]
netc = "netc.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "respx>=0.22",
    "ruff>=0.9",
    "mypy>=1.14",
    "pip-audit>=2.7",
    "types-PyYAML>=6",
    "types-jsonschema>=4",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/netc"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "N", "SIM", "RUF", "TID"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# The fetch package is the only place allowed to use httpx directly.
"src/netc/fetch/**" = ["TID251"]
# Tests use assert, fixtures with fake secrets, and httpx to build mocked responses.
"tests/**" = ["S101", "S105", "S106", "TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"httpx".msg = "Use netc.fetch.SafeHttp; direct httpx use is only allowed in netc.fetch (SSRF protection)."

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
mypy_path = "src"

[[tool.mypy.overrides]]
# Ships without type information (no py.typed).
module = ["recurring_ical_events", "recurring_ical_events.*", "feedparser", "feedparser.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: fast, isolated tests",
    "contract: connector and schema contract tests against recorded fixtures",
    "integration: discovery -> data -> built site",
    "security: SSRF, sanitization, prompt-injection, and header tests",
    "allow_network: test may open real network connections (never used in CI)",
]

# ---------------------------------------------------------------- uv
[tool.uv]
# Supply-chain hygiene: only resolve package versions published at least 14 days ago.
exclude-newer = "14 days"
# Security exception (GHSA-6q48-6c7w-9gw2, 2026-10-20): certifi 2026.7.22 trusts emSign roots
# whose intermediate keys were compromised; the fix, 2026.10.19 (uploaded 2026-10-20 02:24 UTC),
# is younger than 14 days. This admits only certifi releases up to then. Remove on 2026-11-03.
# Security exception (CVE-2026-112907, -112913, -112940, 2026-10-23): filelock 4.0.9 is
# vulnerable; the fix, 4.2.1 (uploaded 2026-10-17 16:48 UTC), is younger than 14 days. It comes
# only through pip-audit's cache (dev). This admits only filelock releases up to then. Remove on
# 2026-10-31.
exclude-newer-package = { certifi = "2026-10-20T03:00:00Z", filelock = "2026-10-17T17:00:00Z" }
